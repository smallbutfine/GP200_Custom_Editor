name: Build self-contained Windows application folder
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build runnable application folder
        shell: pwsh
        run: ./scripts/build-app.ps1
      - name: Upload application folder
        uses: actions/upload-artifact@v4
        with:
          name: GP200-Community-Editor-win-x64
          path: |
            artifacts/app/README.txt
            artifacts/app/GP200_Custom_Editor/**
          if-no-files-found: error
          retention-days: 30
      - name: Zip release package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path artifacts/app/* -DestinationPath GP200-Community-Editor-win-x64.zip -Force
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GP200-Community-Editor-win-x64.zip
          generate_release_notes: true
